name: Python package
on:
  push:
  pull_request:

jobs:

  # -------------------------
  #        LINT JOB
  # -------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run flake8
        run: flake8 formation_indus_ds_avancee

      - name: Run vulture
        run: vulture formation_indus_ds_avancee scripts --min-confidence 100


  # -------------------------
  #     UNIT TESTS JOB
  # -------------------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run unit tests
        run: python -m pytest tests/test_unit


  # -------------------------
  #   FUNCTIONAL TESTS JOB
  # -------------------------
  functional-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run Behave
        run: behave tests/test_functional/features


  # -------------------------
  #        QUALITY JOB
  # -------------------------
  quality:
    runs-on: ubuntu-latest
    needs: functional-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run coverage
        run: |
          python -m pytest --cov=formation_indus_ds_avancee/ tests/test_unit/ -vv -p no:warnings

      - name: Run test pyramid
        run: bash ./tests/tests_pyramid.sh
